<style>
:root {
  --display: Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif;
  --bg: #efeee9;
  --grid: rgba(20, 20, 40, .05);
  --glow-a: rgba(112, 100, 228, .15);
  --glow-b: rgba(80, 128, 232, .11);
  --glass-top: rgba(255, 255, 255, .74);
  --glass-bottom: rgba(250, 249, 245, .56);
  --edge: rgba(255, 255, 255, .95);
  --rim: rgba(20, 20, 35, .07);
  --surface: rgba(248, 247, 243, .9);
  --hairline: rgba(20, 20, 35, .09);
  --hairline-strong: rgba(20, 20, 35, .17);
  --row-hover: rgba(20, 20, 40, .03);
  --field: rgba(255, 255, 255, .55);
  --ink: #16161c;
  --muted: #5e5f69;
  --faint: #93949d;
  --accent: #5b5fc9;
  --accent-soft: rgba(91, 95, 201, .13);
  --solid: #16161c;
  --on-solid: #f5f4f0;
  --perus: #4a8a6c;
  --taitaja: #5b6fcf;
  --mestari: #a3833d;
  --st-kesken: #b7791f;
  --st-later: #3f7fb8;
  --st-help: #c0503f;
  --warn: #b5643b;
  --ok: #4a8a6c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e11;
    --grid: rgba(255, 255, 255, .028);
    --glow-a: rgba(112, 96, 230, .16);
    --glow-b: rgba(70, 118, 230, .10);
    --glass-top: rgba(32, 32, 40, .66);
    --glass-bottom: rgba(18, 18, 23, .52);
    --edge: rgba(255, 255, 255, .08);
    --rim: rgba(255, 255, 255, .07);
    --surface: rgba(22, 22, 28, .9);
    --hairline: rgba(255, 255, 255, .075);
    --hairline-strong: rgba(255, 255, 255, .15);
    --row-hover: rgba(255, 255, 255, .025);
    --field: rgba(255, 255, 255, .025);
    --ink: #ececf1;
    --muted: #9e9fa9;
    --faint: #686974;
    --accent: #9d9ef0;
    --accent-soft: rgba(157, 158, 240, .15);
    --solid: #ececf1;
    --on-solid: #0e0e11;
    --perus: #82c3a4;
    --taitaja: #92a2ee;
    --mestari: #d5b77a;
  --st-kesken: #e0a84e;
  --st-later: #7fb3e6;
  --st-help: #ec8a7c;
    --warn: #e19f7a;
    --ok: #82c3a4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e11;
  --grid: rgba(255, 255, 255, .028);
  --glow-a: rgba(112, 96, 230, .16);
  --glow-b: rgba(70, 118, 230, .10);
  --glass-top: rgba(32, 32, 40, .66);
  --glass-bottom: rgba(18, 18, 23, .52);
  --edge: rgba(255, 255, 255, .08);
  --rim: rgba(255, 255, 255, .07);
  --surface: rgba(22, 22, 28, .9);
  --hairline: rgba(255, 255, 255, .075);
  --hairline-strong: rgba(255, 255, 255, .15);
  --row-hover: rgba(255, 255, 255, .025);
  --field: rgba(255, 255, 255, .025);
  --ink: #ececf1;
  --muted: #9e9fa9;
  --faint: #686974;
  --accent: #9d9ef0;
  --accent-soft: rgba(157, 158, 240, .15);
  --solid: #ececf1;
  --on-solid: #0e0e11;
  --perus: #82c3a4;
  --taitaja: #92a2ee;
  --mestari: #d5b77a;
  --st-kesken: #e0a84e;
  --st-later: #7fb3e6;
  --st-help: #ec8a7c;
  --warn: #e19f7a;
  --ok: #82c3a4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.perus { --lv: var(--perus); }
.taitaja { --lv: var(--taitaja); }
.mestari { --lv: var(--mestari); }

/* Tausta: musta/harmaa, hento ruudukko ja pienet reunahehkut */
.backdrop {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(56vw 46vh at -6% -12%, var(--glow-a), transparent 70%),
    radial-gradient(50vw 46vh at 106% 110%, var(--glow-b), transparent 70%),
    var(--bg);
}
.backdrop::after {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 25%, #000 25%, transparent 80%);
  mask-image: radial-gradient(ellipse 85% 70% at 50% 25%, #000 25%, transparent 80%);
}

/* Lasi vain kelluville pinnoille */
.glass {
  background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom));
  -webkit-backdrop-filter: blur(28px) saturate(150%);
  backdrop-filter: blur(28px) saturate(150%);
  box-shadow: inset 0 1px 0 var(--edge);
}

/* Yläpalkki */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 6px;
  height: 57px; padding: 0 28px;
  border-bottom: 1px solid var(--rim);
}
.brand { display: flex; align-items: center; gap: 11px; background: none; border: 0; padding: 4px 6px; margin-left: -6px; border-radius: 6px; }
.logo-mark { width: 34px; height: 21px; color: var(--ink); display: block; overflow: visible; }
.brand-text { font-family: var(--display); font-size: 20px; letter-spacing: .01em; }
.spacer { flex: 1; }
.streak-btn {
  display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px 0 7px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; font-family: var(--display); font-size: 17px; font-weight: 600;
}
.streak-btn:hover { background: var(--row-hover); border-color: var(--hairline); }
.streak-btn svg { width: 20px; height: 20px; }
.streak-btn.cold svg { filter: grayscale(1); opacity: .5; }
.streak-btn.bump { animation: bump .6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 30% { transform: scale(1.25); } }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 13px; border-radius: 8px;
  border: 1px solid var(--hairline-strong); background: transparent;
  font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: background .15s, border-color .15s, opacity .15s;
}
.btn:hover { background: var(--row-hover); border-color: var(--faint); }
.btn.primary { background: var(--solid); color: var(--on-solid); border-color: var(--solid); }
.btn.primary:hover { opacity: .86; }
.btn.ghost { border-color: transparent; }
.btn.danger { color: var(--warn); }
.icon-btn { width: 34px; padding: 0; justify-content: center; }
.icon-btn svg { width: 18px; height: 18px; }

.wrap { max-width: 1320px; margin: 0 auto; padding: 34px 28px 72px; }

/* Etusivu */
.page-title { font-family: var(--display); font-weight: 600; font-size: 46px; line-height: 1; letter-spacing: -.01em; margin: 0; }
.home-top { padding-bottom: 18px; border-bottom: 1px solid var(--hairline-strong); }
.home-top p { margin: 8px 0 0; color: var(--muted); }
.course-row {
  display: grid; grid-template-columns: minmax(220px, 1.5fr) repeat(3, minmax(90px, .45fr)) minmax(150px, 1fr);
  align-items: center; gap: 24px; width: 100%; text-align: left;
  padding: 20px 10px; margin: 0 -10px; border: 0; border-bottom: 1px solid var(--hairline); background: transparent;
  transition: background .15s;
}
.course-row:hover { background: var(--row-hover); }
.course-row .name { font-family: var(--display); font-size: 26px; font-weight: 600; line-height: 1.1; }
.course-row .meta { color: var(--muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
.fig b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.fig b small { font-size: .45em; color: var(--muted); margin-left: 5px; }
.fig span { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
.fig em { font-style: normal; font-weight: 600; color: var(--accent); }
.fig em.warn { color: var(--warn); }
.fig em.ok { color: var(--ok); }
.thin { position: relative; height: 3px; border-radius: 2px; background: var(--hairline-strong); overflow: hidden; }
.thin i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.row-end span { display: block; font-size: 12px; color: var(--faint); margin-top: 8px; }
.empty-state { padding: 70px 0 30px; max-width: 580px; }
.empty-state .logo-mark { width: 92px; height: 57px; margin-bottom: 30px; }
.empty-state p { color: var(--muted); font-size: 16px; margin: 16px 0 24px; }

/* Kurssin otsikko ja pisteet */
.back { display: inline-block; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 16px; }
.back:hover { color: var(--ink); }
.c-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px 32px; flex-wrap: wrap; }
.c-head h1 { font-family: var(--display); font-weight: 600; font-size: 60px; line-height: .95; letter-spacing: -.01em; margin: 0; }
.c-head .meta { color: var(--muted); font-size: 13px; margin-top: 12px; overflow-wrap: anywhere; }
.c-side { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.name-line { display: flex; align-items: baseline; gap: 10px; color: var(--muted); font-size: 14px; }
.name-line input { width: 230px; border: 0; border-bottom: 1px solid var(--hairline-strong); background: transparent; padding: 3px 2px; font-size: 16px; }
.name-line input:focus { outline: none; border-bottom-color: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.score { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--hairline-strong); }
.figs { display: flex; flex-wrap: wrap; gap: 20px 52px; }
.score .fig b { font-size: 48px; line-height: 1; }
.ruler { position: relative; height: 36px; margin: 28px 0 0; }
.ruler .track { position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: var(--hairline-strong); }
.ruler .fill { position: absolute; left: 0; top: 5px; height: 5px; border-radius: 3px; background: var(--accent); transition: width .4s; }
.ruler .tick { position: absolute; top: 1px; width: 1px; height: 13px; background: var(--faint); }
.ruler .tick span { position: absolute; top: 17px; left: 0; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: var(--muted); }
.ruler .tick span b { font-family: var(--display); font-weight: 600; color: var(--ink); margin-right: 4px; }
.breakdown-line { margin: 14px 0 0; font-size: 13px; color: var(--muted); line-height: 1.8; }
.breakdown-line b { font-family: var(--display); font-weight: 600; color: var(--ink); }
.breakdown-line .sep { color: var(--faint); margin: 0 9px; }
.warn-line { margin: 8px 0 0; font-size: 13.5px; color: var(--warn); }

/* Välilehdet */
.tabbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-top: 40px; border-bottom: 1px solid var(--hairline-strong); }
.tabs { display: flex; gap: 24px; flex-wrap: wrap; }
.tab { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; padding: 0 0 11px; font-size: 15px; font-weight: 600; color: var(--muted); }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); }
.tab small { font-family: var(--display); color: var(--faint); margin-left: 6px; font-weight: 400; font-size: 14px; }
.seg { display: flex; align-items: center; gap: 2px; padding-bottom: 8px; font-size: 13px; color: var(--muted); }
.seg > span { margin-right: 8px; }
.seg .hint { margin: 0 0 0 10px; color: var(--faint); }
.seg button { border: 1px solid transparent; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; padding: 3px 9px; border-radius: 6px; }
.seg button:hover { color: var(--ink); background: var(--row-hover); }
.seg button.on { color: var(--ink); background: color-mix(in srgb, var(--lv) 20%, transparent); border-color: color-mix(in srgb, var(--lv) 55%, transparent); }
details.more { margin-top: 14px; }
details.more summary { cursor: pointer; width: max-content; font-size: 13px; color: var(--muted); list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: " ▾"; color: var(--faint); }
details.more[open] summary::after { content: " ▴"; }
details.more summary:hover { color: var(--ink); }
details.more .breakdown-line { margin-top: 6px; }

/* Pöytäkirja */
.ledger { --cell: 36px; --gap: 4px; }
.l-row {
  display: grid;
  grid-template-columns: minmax(210px, 1fr) calc(var(--np) * (var(--cell) + var(--gap))) calc(var(--nt) * (var(--cell) + var(--gap))) calc(var(--nm) * (var(--cell) + var(--gap)));
  column-gap: 20px; align-items: start;
}
.l-head { position: sticky; top: 57px; z-index: 10; align-items: center; padding: 10px 12px; margin: 0 -12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--hairline-strong); }
.lv-h { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); }
.lv-h i { width: 8px; height: 8px; border-radius: 2px; background: var(--lv); }
.l-sec { display: flex; align-items: baseline; gap: 14px; padding: 30px 0 10px; border-bottom: 1px solid var(--hairline); }
.l-sec h2 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: .005em; }
.l-sec span { font-size: 13px; color: var(--muted); }
.ch { padding: 13px 12px; margin: 0 -12px; border-bottom: 1px solid var(--hairline); transition: background .15s; }
.ch:hover { background: var(--row-hover); }
.ch-name { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 8px; align-items: baseline; }
.ch-no { font-family: var(--display); font-size: 22px; line-height: 1; color: var(--faint); }
.ch.empty .ch-no { color: var(--warn); }
.ch-title { font-weight: 600; line-height: 1.3; }
.ch-count { font-family: var(--display); font-size: 20px; line-height: 1; padding-left: 10px; }
.ch-count.zero { color: var(--warn); }
.ch-sub { grid-column: 2 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; margin-top: 7px; font-size: 12.5px; color: var(--muted); }
.ch-sub label { display: inline-flex; align-items: center; gap: 6px; }
.ch-sub select { border: 0; background: transparent; font-size: 12.5px; font-weight: 600; padding: 1px 0; cursor: pointer; }
.ch-sub select option { background: var(--bg); color: var(--ink); }
.ch-sub input { width: 46px; border: 0; border-bottom: 1px solid var(--hairline-strong); background: transparent; text-align: center; font-family: var(--display); font-size: 15px; padding: 0 2px; }
.ch-sub input:focus { outline: none; border-bottom-color: var(--accent); }
.lv { transition: opacity .15s; }
.lv.dim { opacity: .26; }
.lv.dim:hover { opacity: 1; }
.cells { display: flex; flex-wrap: wrap; gap: var(--gap); }
.cell {
  width: var(--cell); height: 34px; padding: 0; border-radius: 6px;
  border: 1px solid var(--hairline); background: var(--field);
  font-family: var(--display); font-size: 13.5px; font-variant-numeric: tabular-nums;
  transition: background .12s, border-color .12s, color .12s;
}
.cell:hover { border-color: var(--lv); }
.cell.on { background: color-mix(in srgb, var(--lv) 28%, transparent); border-color: color-mix(in srgb, var(--lv) 75%, transparent); font-weight: 600; }
.cell.pop { animation: press .22s ease-out; }
@keyframes press { 0% { transform: scale(.86); } }
@media (prefers-reduced-motion: reduce) { .cell.pop, .streak-btn.bump { animation: none; } }

/* Alaosa */
.extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px 40px; margin-top: 48px; padding-top: 6px; border-top: 1px solid var(--hairline-strong); }
.extra { padding-top: 18px; }
.extra h3 { margin: 0 0 12px; font-family: var(--display); font-size: 18px; font-weight: 600; }
.extra ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.extra li { margin: 3px 0; }
.input { width: 100%; padding: 6px 2px; border: 0; border-bottom: 1px solid var(--hairline-strong); background: transparent; font-size: 15px; }
.input::placeholder, .name-line input::placeholder { color: var(--faint); }
.input:focus { outline: none; border-bottom-color: var(--accent); }
textarea.input { min-height: 120px; resize: vertical; padding: 10px 12px; border: 1px solid var(--hairline-strong); border-radius: 8px; background: var(--field); line-height: 1.45; }
textarea.input:focus { border-color: var(--accent); }
.kertaus-add { display: flex; gap: 8px; align-items: flex-end; }
.kchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
.kchip {
  display: inline-flex; align-items: center; height: 30px; padding: 0 2px 0 9px; border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--accent) 65%, transparent); background: var(--accent-soft);
  font-family: var(--display); font-weight: 600; font-size: 14px;
}
.kchip button { border: 0; background: transparent; width: 22px; height: 22px; border-radius: 4px; line-height: 1; font-size: 16px; color: var(--muted); }
.kchip button:hover { color: var(--ink); background: var(--row-hover); }
.checks { display: flex; flex-direction: column; gap: 8px; }
.checks label { display: flex; align-items: center; gap: 9px; font-size: 14.5px; }
.checks input { width: 17px; height: 17px; accent-color: var(--accent); }
.note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

/* Dialogit */
dialog {
  border: 1px solid var(--rim); border-radius: 14px; padding: 0; width: min(500px, calc(100vw - 32px)); color: var(--ink);
  background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom)), var(--surface);
  -webkit-backdrop-filter: blur(30px) saturate(150%); backdrop-filter: blur(30px) saturate(150%);
  box-shadow: inset 0 1px 0 var(--edge), 0 30px 90px -30px rgba(0, 0, 0, .55);
}
dialog::backdrop { background: rgba(0, 0, 0, .35); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.dlg-body { padding: 24px 24px 8px; }
.dlg-body h2 { margin: 0 0 6px; font-family: var(--display); font-size: 24px; font-weight: 600; }
.dlg-body p { margin: 0 0 16px; color: var(--muted); }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px 20px; flex-wrap: wrap; }
.dlg-foot .left { margin-right: auto; }
.field { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.sheet-list { display: flex; flex-direction: column; margin: 8px 0 10px; max-height: 280px; overflow: auto; border-top: 1px solid var(--hairline); }
.sheet-list label { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: 1px solid var(--hairline); }
.sheet-list input { width: 17px; height: 17px; accent-color: var(--accent); }
.sheet-list b { font-weight: 600; }
.sheet-list small { color: var(--muted); display: block; font-size: 12px; }

/* Streak-ikkuna: pehmeä, hidas ja lämmin */
dialog.streak {
  --ease: cubic-bezier(.16, 1, .3, 1);
  width: min(420px, calc(100vw - 32px)); text-align: center; overflow: hidden;
  border-radius: 28px; border-color: rgba(255, 255, 255, .14);
  background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom)), var(--surface);
  box-shadow: inset 0 1px 0 var(--edge), 0 0 0 1px rgba(255, 140, 60, .06), 0 40px 120px -30px rgba(255, 100, 40, .35), 0 30px 90px -30px rgba(0, 0, 0, .6);
}
dialog.streak[open] { animation: dlgIn 1s var(--ease) both; }
dialog.streak.closing { animation: dlgOut .45s cubic-bezier(.4, 0, .6, 1) both; }
dialog.streak::backdrop { background: rgba(8, 6, 4, .42); -webkit-backdrop-filter: blur(14px) saturate(120%); backdrop-filter: blur(14px) saturate(120%); animation: bdIn .9s ease both; }
dialog.streak.closing::backdrop { animation: bdOut .45s ease both; }
@keyframes dlgIn { from { opacity: 0; transform: translateY(40px) scale(.9); filter: blur(18px); } }
@keyframes dlgOut { to { opacity: 0; transform: translateY(16px) scale(.96); filter: blur(12px); } }
@keyframes bdIn { from { opacity: 0; } }
@keyframes bdOut { to { opacity: 0; } }

/* lämmin hehku ikkunan sisällä */
.streak-aura { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
.streak-aura i { position: absolute; border-radius: 50%; filter: blur(46px); opacity: .55; animation: auraDrift 14s ease-in-out infinite alternate; }
.streak-aura i:nth-child(1) { width: 300px; height: 300px; left: 50%; top: -60px; margin-left: -150px; background: radial-gradient(circle, rgba(255, 128, 40, .75), transparent 65%); animation-duration: 9s; }
.streak-aura i:nth-child(2) { width: 260px; height: 260px; left: -90px; top: 120px; background: radial-gradient(circle, rgba(255, 80, 120, .45), transparent 65%); animation-duration: 13s; }
.streak-aura i:nth-child(3) { width: 260px; height: 260px; right: -100px; top: 200px; background: radial-gradient(circle, rgba(130, 110, 255, .4), transparent 65%); animation-duration: 16s; animation-direction: alternate-reverse; }
.cold-mode .streak-aura i { opacity: .18; filter: blur(46px) grayscale(1); }
@keyframes auraDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(18px, -14px) scale(1.12); } 100% { transform: translate(-16px, 12px) scale(.94); } }

.streak-body { position: relative; padding: 26px 30px 6px; }
.streak-body > * { animation: rise 1.1s var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms + 250ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(8px); } }
.flame-wrap { position: relative; width: 170px; height: 210px; margin: 0 auto 6px; }
.streak-body > .flame-wrap { animation: flameIn 1.6s var(--ease) both; animation-delay: .12s; }
@keyframes flameIn { from { opacity: 0; transform: translateY(46px) scale(.55); filter: blur(16px); } }
.flame { position: relative; display: block; width: 100%; height: 100%; overflow: visible; transform-origin: 50% 92%; animation: sway 5.5s ease-in-out infinite alternate; filter: drop-shadow(0 0 30px rgba(255, 118, 30, .45)); }
.flame-halo { position: absolute; left: 50%; top: 58%; width: 230px; height: 230px; margin: -115px 0 0 -115px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 140, 50, .55), rgba(255, 90, 40, .18) 45%, transparent 70%); filter: blur(10px); animation: breathe 3.6s ease-in-out infinite; }
@keyframes sway { 0% { transform: rotate(-1.6deg) scaleY(.985); } 100% { transform: rotate(1.6deg) scaleY(1.02); } }
@keyframes breathe { 50% { transform: scale(1.12); opacity: .75; } }
.cold-mode .flame { filter: grayscale(1); opacity: .38; animation-duration: 9s; }
.cold-mode .flame-halo { opacity: .15; filter: blur(10px) grayscale(1); }
.streak-num { font-family: var(--display); font-size: 84px; font-weight: 600; line-height: .95; font-variant-numeric: tabular-nums; text-shadow: 0 6px 40px rgba(255, 120, 40, .35); }
.streak-unit { color: var(--muted); margin-top: 4px; }
.streak-msg { margin: 20px 0 6px; font-weight: 600; }
.streak-text { color: var(--muted); font-size: 14px; margin: 0 auto 22px; max-width: 320px; }
.week { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); }
.week i { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--hairline-strong); animation: dotIn .9s var(--ease) both; animation-delay: calc(var(--d) * 80ms + 700ms); }
.week i.on { border-color: transparent; background: radial-gradient(circle at 50% 78%, #ffd36b, #ff6a2a 62%, #ff4a3a); box-shadow: 0 0 16px -4px rgba(255, 110, 30, .9); }
.week i.on.today { animation: dotIn .9s var(--ease) both, glow 2.6s ease-in-out 1.8s infinite; animation-delay: calc(var(--d) * 80ms + 700ms), 1.8s; }
.week i.today:not(.on) { border-color: var(--ink); border-style: dashed; }
.week i.future { opacity: .4; border-style: dotted; }
.week div.is-today { color: var(--ink); font-weight: 700; }
@keyframes dotIn { 0% { opacity: 0; transform: scale(.2); } 60% { opacity: 1; transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes glow { 50% { box-shadow: 0 0 26px 2px rgba(255, 120, 40, .8); transform: scale(1.06); } }
.best { font-size: 12.5px; color: var(--faint); }
dialog.streak .dlg-foot { position: relative; justify-content: center; padding: 14px 24px 26px; animation: rise 1.1s var(--ease) both; animation-delay: .95s; }
.flame-btn {
  height: 44px; padding: 0 28px; border-radius: 999px; border: 0; color: #fff; font-weight: 600; font-size: 15px;
  background: linear-gradient(135deg, #ff9a3d, #ff5a4f 55%, #e8478f);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 10px 30px -10px rgba(255, 90, 60, .75);
  transition: transform .4s var(--ease), box-shadow .4s var(--ease);
}
.flame-btn:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 16px 40px -12px rgba(255, 90, 60, .9); }
@media (prefers-reduced-motion: reduce) {
  dialog.streak[open], dialog.streak.closing, dialog.streak::backdrop, .streak-body > *, .week i, .flame, .flame-halo, .streak-aura i, dialog.streak .dlg-foot { animation: none !important; }
}

#drop {
  position: fixed; inset: 0; z-index: 100; display: none; place-items: center;
  background: rgba(0, 0, 0, .25); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
#drop.on { display: grid; }
#drop div { padding: 28px 36px; border-radius: 14px; border: 1.5px dashed var(--ink); background: var(--surface); font-size: 18px; font-weight: 600; }
#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--rim);
  background: var(--solid); color: var(--on-solid); font-size: 14px; font-weight: 500;
  transition: opacity .2s, transform .2s; z-index: 200; max-width: calc(100vw - 32px);
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast svg { width: 18px; height: 18px; flex: none; }

/* ---------- Valikkorivi ---------- */
:root { --spring: cubic-bezier(.34, 1.56, .64, 1); --out: cubic-bezier(.16, 1, .3, 1); }
.menubar { display: flex; align-items: center; gap: 1px; min-width: 0; margin-left: 16px; padding-left: 12px; border-left: 1px solid var(--hairline); }
.mb { position: relative; border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; font-size: 14px; color: var(--muted); white-space: nowrap; transition: color .2s, background .25s; }
.mb:hover, .mb.open { color: var(--ink); background: var(--row-hover); }
.mb::after { content: ""; position: absolute; left: 11px; right: 11px; bottom: 2px; height: 1.5px; border-radius: 1px; background: var(--accent); transform: scaleX(0); transition: transform .4s var(--out); }
.mb:hover::after, .mb.open::after { transform: scaleX(1); }
.menu {
  position: fixed; z-index: 60; min-width: 270px; padding: 6px; border-radius: 12px; border: 1px solid var(--rim);
  display: flex; flex-direction: column; transform-origin: top left;
  background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom)), var(--surface);
  -webkit-backdrop-filter: blur(28px) saturate(150%); backdrop-filter: blur(28px) saturate(150%);
  box-shadow: inset 0 1px 0 var(--edge), 0 24px 60px -20px rgba(0, 0, 0, .45);
}
.menu[hidden] { display: none; }
.menu.in { animation: menuIn .34s var(--out) both; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-8px) scale(.96); filter: blur(4px); } }
.m-item {
  display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; width: 100%;
  text-align: left; border: 0; background: transparent; padding: 7px 10px 7px 8px; border-radius: 7px; font-size: 14px; transition: background .15s;
}
.menu.in .m-item, .menu.in .m-sep, .menu.in .m-head { animation: itemIn .42s var(--out) both; animation-delay: calc(var(--j) * 22ms + 40ms); }
@keyframes itemIn { from { opacity: 0; transform: translateX(-6px); } }
.m-item:hover:not(:disabled), .m-item:focus-visible { background: var(--accent-soft); outline: none; }
.m-item .m-label { transition: transform .3s var(--out); }
.m-item:hover:not(:disabled) .m-label, .m-item:focus-visible .m-label { transform: translateX(3px); }
.m-item:disabled { color: var(--faint); cursor: default; }
.m-item.danger:not(:disabled) { color: var(--warn); }
.m-check { color: var(--accent); font-size: 12px; text-align: center; }
.m-key { font-size: 12px; color: var(--faint); font-family: var(--display); letter-spacing: .02em; }
.m-sep { height: 1px; background: var(--hairline); margin: 5px 6px; }
.m-head { padding: 6px 10px 2px 34px; font-size: 12px; color: var(--faint); }
.keys { width: 100%; border-collapse: collapse; font-size: 14px; }
.keys td { padding: 8px 0; border-bottom: 1px solid var(--hairline); }
.keys td:first-child { width: 150px; }
.keys kbd { font-family: var(--display); font-size: 13px; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--hairline-strong); background: var(--field); }
.about-logo { width: 110px; height: 68px; color: var(--ink); display: block; margin: 6px 0 18px; }

/* ---------- Mikroanimaatiot ---------- */
.btn { transition: transform .4s var(--spring), background .2s, border-color .2s, box-shadow .4s var(--out), opacity .2s; }
.btn:hover { transform: translateY(-1.5px); box-shadow: 0 8px 20px -12px rgba(0, 0, 0, .45); }
.btn:active { transform: translateY(0) scale(.96); transition-duration: .08s; }
.btn .plus { display: inline-block; font-size: 16px; line-height: 1; transition: transform .55s var(--spring); }
.btn:hover .plus { transform: rotate(90deg) scale(1.2); }
.btn .dl { display: inline-block; }
.btn:hover .dl { animation: dlBounce .9s var(--out) infinite; }
@keyframes dlBounce { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(3px); } }

.logo-mark .lg-plus { transform-box: fill-box; transform-origin: center; transition: transform .8s var(--spring); }
.logo-mark .lg-m { transition: transform .55s var(--spring); }
.brand:hover .lg-plus { transform: rotate(180deg) scale(1.18); }
.brand:hover .lg-m { transform: translateY(-22px); }
.brand-text { transition: letter-spacing .55s var(--out); }
.brand:hover .brand-text { letter-spacing: .045em; }

.streak-btn { transition: background .2s, border-color .2s; }
.streak-btn svg { overflow: visible; transform-origin: 50% 90%; transition: filter .5s var(--out), opacity .5s, transform .55s var(--spring); }
.streak-btn:hover svg { filter: grayscale(0) drop-shadow(0 0 7px rgba(255, 120, 30, .9)); opacity: 1; transform: scale(1.2) translateY(-1px); }
.streak-btn .f-out, .streak-btn .f-in, #toast .f-out, #toast .f-in { transform-box: fill-box; transform-origin: 50% 100%; }
.streak-btn:hover .f-out, #toast .f-out { animation: flickOut .8s ease-in-out infinite alternate; }
.streak-btn:hover .f-in, #toast .f-in { animation: flickIn .5s ease-in-out infinite alternate; }
@keyframes flickOut { 0% { transform: scale(1, 1) skewX(0); } 40% { transform: scale(.96, 1.08) skewX(-4deg); } 100% { transform: scale(1.03, .95) skewX(3deg); } }
@keyframes flickIn { 0% { transform: scale(1, 1); } 100% { transform: scale(.85, 1.2) translateY(-5%); } }
.streak-btn span { display: inline-block; transition: transform .45s var(--spring); }
.streak-btn:hover span { transform: translateY(-1px) scale(1.08); }

#themeBtn svg { transition: transform .75s var(--spring); }
#themeBtn:hover svg.moon { transform: rotate(-28deg) scale(1.12); }
#themeBtn:hover svg.sun { transform: rotate(90deg) scale(1.12); }
#themeBtn svg.spin-in { animation: spinIn .75s var(--spring); }
@keyframes spinIn { from { transform: rotate(-140deg) scale(.3); opacity: 0; } }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

.wrap.enter > * { animation: pageIn .75s var(--out) both; }
.wrap.enter > :nth-child(2) { animation-delay: .05s; }
.wrap.enter > :nth-child(3) { animation-delay: .1s; }
.wrap.enter > :nth-child(n+4) { animation-delay: .15s; }
@keyframes pageIn { from { opacity: 0; transform: translateY(14px); } }
.wrap.enter .ch, .wrap.enter .l-sec, .wrap.enter .course-row { animation: rowIn .65s var(--out) both; animation-delay: calc(var(--n, 0) * 28ms + 140ms); }
@keyframes rowIn { from { opacity: 0; transform: translateY(10px); } }

.tab, .tab.on { position: relative; border-bottom-color: transparent; }
.tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); transform: scaleX(0); transition: transform .5s var(--out); }
.tab:hover::after { transform: scaleX(.35); }
.tab.on::after { transform: scaleX(1); }
.seg button { transition: color .2s, background .35s, border-color .35s, transform .4s var(--spring); }
.seg button:hover { transform: translateY(-1px); }
.seg button:active { transform: scale(.94); }

.course-row { position: relative; padding-right: 52px; }
.course-row::after { content: "→"; position: absolute; right: 16px; top: 50%; font-size: 20px; color: var(--muted); opacity: 0; transform: translate(-14px, -50%); transition: opacity .3s, transform .5s var(--out); }
.course-row:hover::after { opacity: 1; transform: translate(0, -50%); }
.course-row .name { transition: transform .5s var(--out); }
.course-row:hover .name { transform: translateX(5px); }
.back .arr { display: inline-block; transition: transform .45s var(--out); }
.back:hover .arr { transform: translateX(-5px); }

.fig b i.v { font-style: normal; display: inline-block; }
.fig b i.v.changed { animation: numBump .75s var(--out); }
@keyframes numBump { 0% { transform: translateY(-10px); opacity: .15; color: var(--accent); } 60% { color: var(--accent); } }
.ruler .fill { transition: width 1s var(--out); }
.ch-count { display: inline-block; }
.ch-count.bump { animation: countBump .6s var(--spring); }
@keyframes countBump { 0% { transform: scale(.5); opacity: .2; } }

.cell { transition: transform .35s var(--spring), background .25s, border-color .25s, color .25s, box-shadow .35s var(--out); }
.cell:hover { transform: translateY(-2px); box-shadow: 0 7px 16px -9px var(--lv); }
.cell:active { transform: scale(.9); transition-duration: .08s; }
.cell.pop { animation: cellPop .55s var(--spring); }
@keyframes cellPop { 0% { transform: scale(.7); } }
.cell.unpop { animation: cellUnpop .45s var(--out); }
@keyframes cellUnpop { 0% { transform: scale(1.12); opacity: .5; } }
.lv { transition: opacity .55s var(--out); }
.ch { transition: background .3s; }
.ch.flash, .extra.flash { animation: flash 1.8s var(--out); }
@keyframes flash { 0%, 35% { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); } }

.name-line input, .ch-sub input, input.input { background: linear-gradient(var(--accent), var(--accent)) no-repeat 50% 100% / 0% 2px; transition: background-size .5s var(--out), border-color .3s; }
.name-line input:focus, .ch-sub input:focus, input.input:focus { background-size: 100% 2px; }
.kchip { transition: transform .35s var(--spring), opacity .25s; }
.kchip.new { animation: cellPop .55s var(--spring); }
.kchip.out { transform: scale(.5); opacity: 0; }
.checks label { transition: transform .35s var(--out); }
.checks label:hover { transform: translateX(3px); }
details.more[open] .breakdown-line { animation: rowIn .5s var(--out); }
dialog:not(.streak)[open] { animation: dlgPop .5s var(--out) both; }
dialog:not(.streak)[open]::backdrop { animation: bdIn .4s ease both; }
@keyframes dlgPop { from { opacity: 0; transform: translateY(14px) scale(.97); filter: blur(6px); } }
#toast { transition: opacity .3s, transform .6s var(--spring); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
/* ---------- Tervehdys ---------- */
.page-title .who { color: var(--accent); }
.list-title { margin: 34px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--hairline-strong); font-family: var(--display); font-size: 19px; font-weight: 600; }
.home-top.greet { border-bottom: 0; padding-bottom: 0; }
.streak-hello { font-family: var(--display); font-size: 21px; font-weight: 600; margin-bottom: 2px; }

#onboard { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; padding: 24px; overflow: auto; }
#onboard[hidden] { display: none; }
#onboard.out { animation: obOut .7s var(--out) both; }
@keyframes obOut { to { opacity: 0; filter: blur(10px); transform: scale(1.03); } }
.ob-card {
  position: relative; width: min(470px, 100%); padding: 34px 34px 28px; border-radius: 22px; border: 1px solid var(--rim);
  background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom)), var(--surface);
  -webkit-backdrop-filter: blur(30px) saturate(150%); backdrop-filter: blur(30px) saturate(150%);
  box-shadow: inset 0 1px 0 var(--edge), 0 40px 100px -40px rgba(0, 0, 0, .5);
  animation: dlgIn 1s var(--out) both;
}
.ob-card > * { animation: rise 1s var(--out) both; animation-delay: calc(var(--i, 0) * 80ms + 200ms); }
.ob-logo { width: 92px; height: 57px; color: var(--ink); display: block; margin-bottom: 26px; overflow: visible; }
.ob-logo .lg-plus { transform-box: fill-box; transform-origin: center; animation: plusSpin 1.4s var(--spring) .6s both; }
@keyframes plusSpin { from { transform: rotate(-180deg) scale(0); } }
.ob-card h1 { font-family: var(--display); font-size: 34px; font-weight: 600; line-height: 1.05; margin: 0 0 10px; }
.ob-card > p { color: var(--muted); margin: 0 0 24px; }
.ob-card .field { display: block; }
.ob-card .field .input { width: 100%; height: 46px; font-size: 17px; }
.ob-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 26px; }
.ob-actions small { color: var(--faint); font-size: 12.5px; }
.btn.big { height: 42px; padding: 0 22px; font-size: 15px; border-radius: 10px; }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.ob-hello { text-align: center; font-family: var(--display); font-size: clamp(48px, 9vw, 96px); font-weight: 600; line-height: 1; animation: helloIn 1.1s var(--out) both; }
.ob-hello span { color: var(--accent); }
.ob-hello small { display: block; margin-top: 18px; font-family: "Segoe UI", system-ui, sans-serif; font-size: 18px; font-weight: 400; color: var(--muted); animation: rise 1s var(--out) .4s both; }
@keyframes helloIn { from { opacity: 0; transform: scale(.85); filter: blur(14px); } }
@media (max-width: 520px) { .ob-card { padding: 26px 22px 22px; } }

@media (max-width: 760px) {
  .menubar { margin-left: 6px; padding-left: 6px; overflow-x: auto; scrollbar-width: none; }
  .menubar::-webkit-scrollbar { display: none; }
  .mb { padding: 5px 7px; font-size: 13px; }
}

@media (max-width: 1040px) {
  .l-head { display: none; }
  .l-row { grid-template-columns: minmax(0, 1fr); row-gap: 7px; }
  .ch-name { margin-bottom: 4px; }
  .lv { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; padding-left: 38px; }
  .lv::before { content: attr(data-label); font-size: 12px; font-weight: 600; color: var(--lv); }
  .lv:has(.cells:empty) { display: none; }
  .course-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 20px; }
  .course-row > :first-child, .course-row > :last-child { grid-column: 1 / -1; }
}

/* ---------- Omat merkintätavat ---------- */
.st-done { --st: var(--accent); }
.st-kesken { --st: var(--st-kesken); }
.st-later { --st: var(--st-later); }
.st-help { --st: var(--st-help); }
.cell { position: relative; }
.cell.st { border-style: dashed; border-color: var(--st); background: color-mix(in srgb, var(--st) 13%, transparent); }
.cell.st::after {
  content: attr(data-ic); position: absolute; top: -6px; right: -6px; width: 15px; height: 15px; border-radius: 50%;
  display: grid; place-items: center; background: var(--st); color: #fff; font: 700 10px/1 "Segoe UI", system-ui, sans-serif;
  box-shadow: 0 0 0 2px var(--bg);
}
.cell.has-note::before { content: ""; position: absolute; left: 4px; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); opacity: .55; }
.brush { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin: 14px 0 2px; font-size: 13px; color: var(--muted); }
.brush > span { margin-right: 6px; }
.brush .hint { margin: 0 0 0 10px; color: var(--faint); }
.brush button {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: transparent; color: var(--muted);
  font-weight: 600; font-size: 13px; padding: 3px 10px 3px 6px; border-radius: 6px; transition: color .2s, background .35s, border-color .35s, transform .4s var(--spring);
}
.brush button:hover { color: var(--ink); background: var(--row-hover); transform: translateY(-1px); }
.brush button.on { color: var(--ink); background: color-mix(in srgb, var(--st) 16%, transparent); border-color: color-mix(in srgb, var(--st) 55%, transparent); }
.brush kbd { font-family: var(--display); font-size: 11px; color: var(--faint); font-weight: 400; }
.st-ic { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--st); color: #fff; font: 700 10.5px/1 "Segoe UI", system-ui, sans-serif; flex: none; }
#cellpop { width: 260px; min-width: 0; }
#cellpop .pop-head { padding: 6px 10px 4px; font-size: 12px; color: var(--faint); }
#cellpop .pop-head b { color: var(--ink); font-family: var(--display); font-size: 15px; margin-right: 6px; }
#cellpop .m-item { grid-template-columns: 20px 1fr auto; }
#cellpop textarea { margin: 4px 6px 6px; width: calc(100% - 12px); min-height: 64px; font-size: 13.5px; padding: 8px 10px; box-sizing: border-box; }

      const rc = byRow.get(r);
      if (!rc || headerRows.includes(r)) break;
      const name = rc.find(x => x.c === 1)?.v;
      if (!name) break;
      const levels = {};
      let total = 0;
      for (const L of LEVELS) {
        const rg = ranges[L.k];
        levels[L.k] = rg ? rc.filter(x => x.c >= rg[0] && x.c <= rg[1] && x.v).map(x => ({ n: x.v, ref: x.ref })) : [];
        total += levels[L.k].length;
      }
      if (!total) break;
      chapters.push({
        id: si + '-' + r, name, levels,
        doneRef: doneCol ? colName(doneCol) + r : null,
        tpRef: tpCol ? colName(tpCol) + r : null,
      });
    }
    if (chapters.length) sections.push({ title: !a || /^luku$/i.test(a) ? title : a, chapters });
  }

  // Kertaustehtävät-rivi
  let kertaus = null;
  for (const cell of cells.values()) {
    if (cell.c === 1 && /^kertausteht/i.test(cell.v)) {
      kertaus = { refs: byRow.get(cell.r).filter(x => x.c > 1 && !x.v).map(x => x.ref) };
      break;
    }
  }

  // Ohjeet: A-sarakkeen tekstit ennen ensimmäistä taulukkoa
  const firstHr = headerRows[0] || 0;
  const info = [...cells.values()].filter(x => x.c === 1 && x.r > 1 && x.r < firstHr && x.v).sort((a, b) => a.r - b.r).map(x => x.v);

  // Yhteenvetokentät (nimi, tehtävämäärät, pisteet) tunnistetaan otsikkotekstistä
  const isBox = cell => cell && !cell.v && styles[cell.s]?.box;
  const rightBox = cell => {
    const m = mergeOf(cell), start = m ? m.c2 + 1 : cell.c + 1;
    return byRow.get(cell.r).find(x => x.c >= start && isBox(x))?.ref || null;
  };
  const leftBox = cell => {
    const x = byRow.get(cell.r).filter(x => x.c < cell.c).pop();
    return isBox(x) ? x.ref : null;
  };
  const LABELS = {
    name: [/^nimi:?$/i, rightBox], total: [/kokonaismäärä/i, rightBox],
    perusN: [/^perustehtäviä$/i, rightBox], perusP: [/^perustehtävien pisteet/i, rightBox],
    taitajaN: [/^taitajatehtäviä$/i, rightBox], taitajaP: [/^taitajatehtävien pisteet/i, rightBox],
    mestariN: [/^mestaritehtäviä$/i, rightBox], mestariP: [/^mestaritehtävien pisteet/i, rightBox],
    tpN: [/^taitopuntarit$/i, rightBox], tpP: [/^taitopuntaripisteet/i, rightBox],
    kertausN: [/^kertaustehtäviä$/i, rightBox], kertausP: [/^kertaustehtävien pisteet/i, rightBox],
    points: [/^tehtäväpisteet yhteensä/i, rightBox],
    vihko: [/^vihkoon$/i, leftBox], digikirja: [/^digikirjaan$/i, leftBox], laskin: [/^laskimeen/i, leftBox],
  };
  const summary = {};
  for (const cell of cells.values()) {
    for (const [k, [re, fn]] of Object.entries(LABELS)) {
      if (!summary[k] && re.test(cell.v)) { const ref = fn(cell); if (ref) summary[k] = ref; }
    }
  }
  return { name: sheetName, title, path, hidden: false, sections, kertaus, info, summary };
}

async function parseXlsx(buf, fileName) {
  const entries = await readZip(buf);
  const wb = await readXml(entries, 'xl/workbook.xml');
  if (!wb) throw new Error('Tiedostosta ei löytynyt Excel-työkirjaa.');
  const rels = await readXml(entries, 'xl/_rels/workbook.xml.rels');
  const relMap = {};
  for (const r of rels.getElementsByTagName('Relationship')) {
    const t = r.getAttribute('Target');
    relMap[r.getAttribute('Id')] = t.startsWith('/') ? t.slice(1) : 'xl/' + t;
  }
  const ssDoc = await readXml(entries, 'xl/sharedStrings.xml');
  const strings = ssDoc ? [...ssDoc.getElementsByTagName('si')].map(si =>
    [...si.getElementsByTagName('t')].filter(t => t.parentNode.localName !== 'rPh').map(t => t.textContent).join('')) : [];
  const styles = parseStyles(await readXml(entries, 'xl/styles.xml'));

  const sheets = [];
  let si = 0;
  for (const s of wb.getElementsByTagName('sheet')) {
    const path = relMap[s.getAttributeNS(RELNS, 'id') || s.getAttribute('r:id')];
    const doc = path && await readXml(entries, path);
    if (!doc) continue;
    const merges = [...doc.getElementsByTagName('mergeCell')].map(m => {
      const [a, b] = m.getAttribute('ref').split(':'); const A = splitRef(a), B = splitRef(b || a);
      return { r1: A.r, c1: A.c, r2: B.r, c2: B.c };
    });
    const sheet = parseSheet(readCells(doc, strings), merges, styles, s.getAttribute('name'), path, si++);
    if (sheet.sections.length) sheets.push(sheet);
  }
  if (!sheets.length) throw new Error('Tiedostosta ei löytynyt tehtävätaulukkoa (otsikoita Perustaso / Taitajataso / Mestaritaso).');

  const all = strings.join('\n');
  const grab = re => { const m = re.exec(all); return m ? parseFloat(m[1].replace(',', '.')) : null; };
  let scoring = null;
  const perus = grab(/Perustason tehtävä:\s*([\d,.]+)/i);
  if (perus != null) {
    scoring = {
      perus, taitaja: grab(/Taitajatason tehtävä:\s*([\d,.]+)/i) ?? perus, mestari: grab(/Mestaritason tehtävä:\s*([\d,.]+)/i) ?? perus,
      tp: grab(/taitopuntarista saat\s*([\d,.]+)/i) ?? 0, kertaus: grab(/kertaustehtävästä saat\s*([\d,.]+)/i) ?? 0,
      max: grab(/Tehtävistä voi saada max\.?\s*(\d+)/i) ?? grab(/Tehtävien pisteet \(max\s*(\d+)/i),
    };
  }
  const sm = /(\d+)\s*liian vähän,\s*(\d+)\s*ok,\s*yli\s*(\d+)\s*hyvä,\s*yli\s*(\d+)\s*hienoa/i.exec(all);
  const scale = sm ? [+sm[1], +sm[2], +sm[3], +sm[4]] : null;

  const sumSheet = sheets.find(s => Object.keys(s.summary).length);
  const summary = sumSheet ? { path: sumSheet.path, refs: sumSheet.summary } : null;
  const kSheet = sheets.find(s => s.kertaus);
  const kertaus = kSheet ? { path: kSheet.path, refs: kSheet.kertaus.refs } : null;
  for (const s of sheets) { delete s.summary; delete s.kertaus; }
  return { fileName, sheets, scoring, scale, summary, kertaus, entries };
}

/* ---------- Laskenta ---------- */
// Merkintä tallennetaan avaimella "taso|tehtävä", joten sama tehtävä voi olla tehty usealla tasolla
const markKey = (lvl, n) => lvl + '|' + n;
const splitKey = k => { const i = k.indexOf('|'); return [k.slice(0, i), k.slice(i + 1)]; };
function chapterMarks(c, ch) {
  const m = c.state.marks[ch.id] || {};
  return Object.keys(m).map(splitKey).filter(([lvl, n]) => ch.levels[lvl]?.some(t => t.n === n)).map(([lvl, n]) => ({ lvl, n, t: m[markKey(lvl, n)].t }));
}
function chapterCount(c, ch) { return chapterMarks(c, ch).length; }
// Vanhassa muodossa avain oli pelkkä tehtävänumero ja taso oli arvossa
function migrateMarks(c) {
  c.state.flags ||= {};
  c.state.tnotes ||= {};
  for (const [chId, m] of Object.entries(c.state.marks)) {
    for (const [k, v] of Object.entries(m)) {
      if (!k.includes('|') && v?.lvl) { m[markKey(v.lvl, k)] = { t: v.t }; delete m[k]; }
    }
    if (!Object.keys(m).length) delete c.state.marks[chId];
  }
}
function stats(c) {
  const s = { lv: { perus: 0, taitaja: 0, mestari: 0 }, tasks: 0, chapters: 0, started: 0, tp: 0, tpTotal: 0, kertaus: c.state.kertaus.length, today: 0 };
  const today = new Date().toDateString();
  for (const sh of c.sheets) {
    if (sh.hidden) continue;
    for (const sec of sh.sections) for (const ch of sec.chapters) {
      s.chapters++;
      let n = 0;
      for (const mk of chapterMarks(c, ch)) {
        s.lv[mk.lvl]++; n++;
        if (new Date(mk.t).toDateString() === today) s.today++;
      }
      if (n) s.started++;
      s.tasks += n;
      if (ch.tpRef) { s.tpTotal++; if (String(c.state.tp[ch.id] || '').trim()) s.tp++; }
    }
  }
  s.today += c.state.kertaus.filter(k => new Date(k.t).toDateString() === today).length;
  s.all = s.tasks + s.kertaus;
  const sc = c.scoring;
  if (sc) {
    s.p = { perus: s.lv.perus * sc.perus, taitaja: s.lv.taitaja * sc.taitaja, mestari: s.lv.mestari * sc.mestari, tp: s.tp * sc.tp, kertaus: s.kertaus * sc.kertaus };
    s.raw = Object.values(s.p).reduce((a, b) => a + b, 0);
    s.points = sc.max ? Math.min(sc.max, s.raw) : s.raw;
  }
  return s;
}
function scaleWord(c, n) {
  const sc = c.scale;
  if (!sc) return null;
  if (n > sc[3]) return ['hienoa!', 'ok'];
  if (n > sc[2]) return ['hyvä', 'ok'];
  if (n >= sc[1]) return ['ok', ''];
  return [n <= sc[0] ? 'liian vähän' : 'vielä vähän', 'warn'];
}

/* ---------- Täytetyn Excelin vienti ---------- */
async function exportXlsx(c, silent) {
  const bytes = getFile(c.id);
  if (!bytes) { toast('Alkuperäistä Excel-tiedostoa ei löytynyt.'); return; }
  const entries = await readZip(bytes.buffer);
  const docs = new Map();
  const getDoc = async path => { if (!docs.has(path)) docs.set(path, await readXml(entries, path)); return docs.get(path); };
  const styles = await getDoc('xl/styles.xml');
  const mk = (doc, name, attrs = {}) => { const e = doc.createElementNS(NS, name); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };

  // Vihreä täyttö tehdyille tehtäville
  const fills = styles.getElementsByTagName('fills')[0];
  const fill = mk(styles, 'fill'), pf = mk(styles, 'patternFill', { patternType: 'solid' });
  pf.append(mk(styles, 'fgColor', { rgb: 'FF92D050' }), mk(styles, 'bgColor', { indexed: '64' }));
  fill.append(pf); fills.append(fill);
  const fillId = kids(fills, 'fill').length - 1;
  fills.setAttribute('count', fillId + 1);
  const cellXfs = styles.getElementsByTagName('cellXfs')[0], baseXfs = kids(cellXfs, 'xf'), styleMap = new Map();
  const greenStyle = s => {
    if (!styleMap.has(s)) {
      const x = (baseXfs[s] || baseXfs[0]).cloneNode(true);
      x.setAttribute('fillId', fillId); x.setAttribute('applyFill', '1');
      cellXfs.append(x);
      const n = kids(cellXfs, 'xf').length;
      cellXfs.setAttribute('count', n);
      styleMap.set(s, n - 1);
    }
    return styleMap.get(s);
  };

  function getCell(doc, ref) {
    const { r, c: col } = splitRef(ref);
    const sd = doc.getElementsByTagName('sheetData')[0];
    let row = kids(sd, 'row').find(x => +x.getAttribute('r') === r);
    if (!row) {
      row = mk(doc, 'row', { r });
      sd.insertBefore(row, kids(sd, 'row').find(x => +x.getAttribute('r') > r) || null);
    }
    let cell = kids(row, 'c').find(x => x.getAttribute('r') === ref);
    if (!cell) {
      cell = mk(doc, 'c', { r: ref });
      row.insertBefore(cell, kids(row, 'c').find(x => splitRef(x.getAttribute('r')).c > col) || null);
      row.removeAttribute('spans');
    }
    return cell;
  }
  function setValue(doc, ref, val) {
    const cell = getCell(doc, ref);
    for (const k of [...cell.children]) if (['f', 'v', 'is'].includes(k.localName)) k.remove();
    if (typeof val === 'number') {
      cell.removeAttribute('t');
      const v = mk(doc, 'v'); v.textContent = String(Math.round(val * 100) / 100); cell.append(v);
    } else {
      cell.setAttribute('t', 'inlineStr');
      const is = mk(doc, 'is'), t = mk(doc, 't');
      t.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
      t.textContent = val; is.append(t); cell.append(is);
    }
  }
  const numOrText = v => { const n = Number(String(v).replace(',', '.')); return String(v).trim() !== '' && !isNaN(n) ? n : String(v); };

  for (const sh of c.sheets) {
    if (sh.hidden) continue;
    const doc = await getDoc(sh.path);
    for (const sec of sh.sections) for (const ch of sec.chapters) {
      const m = c.state.marks[ch.id] || {};
      for (const L of LEVELS) for (const t of ch.levels[L.k]) {
        if (m[markKey(L.k, t.n)]) {
          const cell = getCell(doc, t.ref);
          cell.setAttribute('s', greenStyle(+(cell.getAttribute('s') || 0)));
        }
      }
      const n = chapterCount(c, ch);
      if (ch.doneRef && n) setValue(doc, ch.doneRef, n);
      const tp = String(c.state.tp[ch.id] || '').trim();
      if (ch.tpRef && tp) setValue(doc, ch.tpRef, numOrText(tp));
    }
  }
  if (c.kertaus && c.state.kertaus.length && !c.sheets.find(s => s.path === c.kertaus.path)?.hidden) {
    const doc = await getDoc(c.kertaus.path), refs = c.kertaus.refs, list = c.state.kertaus.map(k => k.n);
    refs.forEach((ref, i) => {
      if (i >= list.length) return;
      const v = i === refs.length - 1 ? list.slice(i).join(', ') : list[i];
      setValue(doc, ref, i === refs.length - 1 && list.length > refs.length ? v : numOrText(v));
    });
  }
  if (c.summary) {
    const doc = await getDoc(c.summary.path), R = c.summary.refs, s = stats(c);
    const put = (k, v) => { if (R[k] && v != null) setValue(doc, R[k], v); };
    const studentName = (c.student || fullName()).trim();
    if (studentName) put('name', studentName);
    put('total', s.all);
    for (const k of ['perus', 'taitaja', 'mestari']) { put(k + 'N', s.lv[k]); if (s.p) put(k + 'P', s.p[k]); }
    put('tpN', s.tp); put('kertausN', s.kertaus);
    if (s.p) { put('tpP', s.p.tp); put('kertausP', s.p.kertaus); put('points', s.points); }
    for (const k of ['vihko', 'digikirja', 'laskin']) if (c.state.doneIn[k]) put(k, 'X');
  }

  const files = [];
  for (const [name, e] of entries) {
    if (docs.has(name)) {
      const xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + new XMLSerializer().serializeToString(docs.get(name).documentElement);
      const u8 = new TextEncoder().encode(xml);
      files.push({ name, method: 8, crc: crc32(u8), usize: u8.length, raw: await streamBytes(u8, new CompressionStream('deflate-raw')) });
    } else files.push({ name, method: e.method, crc: e.crc, usize: e.usize, raw: e.raw });
  }
  const whoName = (c.student || fullName()).trim();
  const who = whoName ? ' – ' + whoName : '';
  const out = { blob: writeZip(files), name: safeName(c.name + who) + '.xlsx' };
  if (silent === 'blob') return out;
  download(out.blob, out.name);
  if (!silent) toast('Täytetty Excel ladattu.');
  return out;
}

/* ---------- Streak ---------- */
const DAYS_KEY = 'mathsmart.days';
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
let activeDays = new Set();
function saveDays() {
  try { localStorage.setItem(DAYS_KEY, JSON.stringify([...activeDays].sort())); } catch (e) {}
}
function loadDays() {
  try { activeDays = new Set(JSON.parse(localStorage.getItem(DAYS_KEY) || '[]')); }
  catch (e) { activeDays = new Set(); }
  // Aiemmat merkinnät lasketaan mukaan streakiin
  for (const c of courses) {
    for (const m of Object.values(c.state.marks)) for (const mk of Object.values(m)) if (mk.t) activeDays.add(dayKey(new Date(mk.t)));
    for (const k of c.state.kertaus) if (k.t) activeDays.add(dayKey(new Date(k.t)));
  }
  saveDays();
}
function streakInfo() {
  const todayDone = activeDays.has(dayKey());
  const d = new Date();
  if (!todayDone) d.setDate(d.getDate() - 1);
  let cur = 0;
  while (activeDays.has(dayKey(d))) { cur++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  for (const k of [...activeDays].sort()) {
    const dt = new Date(k + 'T12:00');
    run = prev && Math.round((dt - prev) / 864e5) === 1 ? run + 1 : 1;
    best = Math.max(best, run);
    prev = dt;
  }
  return { cur, best, todayDone };
}
const MINI_FLAME = '<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="mf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4a1c"/><stop offset=".6" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffc247"/></linearGradient></defs><g transform="translate(0 2)"><path class="f-out" fill="url(#mf)" d="M12 1.8c.7 3.6 5.9 6.6 5.9 12A5.9 5.9 0 0 1 12 19.7a5.9 5.9 0 0 1-5.9-5.9c0-2.6 1.3-4.4 2.8-5.9.2 1.7 1 3 2.2 3.6C10.9 8.3 11.3 5.1 12 1.8z"/><path class="f-in" fill="#ffe3a1" d="M12 12.6c1 1.4 2.4 2.4 2.4 4.1a2.4 2.4 0 0 1-4.8 0c0-1.4 1-2.5 2.4-4.1z"/></g></svg>';
function drawStreakBtn(bump) {

  b.classList.toggle('cold', !s.todayDone);

  if (bump) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }

function countUp(el, to, instant) {

  const start = performance.now() + 450, dur = Math.min(1600, 600 + to * 140);
  const step = now => {

    el.textContent = Math.round((1 - Math.pow(1 - p, 4)) * to);

  // Kuluva viikko maanantaista sunnuntaihin
  const monday = new Date();
  monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7);
  for (let i = 0; i < 7; i++) { const d = new Date(monday); d.setDate(monday.getDate() + i); days.push(d); }
  const todayKey = dayKey();
  const WD = ['su', 'ma', 'ti', 'ke', 'to', 'pe', 'la'];
  const art = document.createElement('div');
  art.innerHTML = flameSvg(cold);
  const svg = art.firstElementChild;
  if (reduce) svg.pauseAnimations?.();
  const msg = s.todayDone ? 'Tämän päivän tehtävät on merkitty. Liekki palaa!'
    : s.cur ? 'Merkitse tänään vähintään yksi tehtävä, niin streak jatkuu.'

  const num = h('div', { class: 'streak-num', style: '--i:1' }, reduce ? s.cur : 0);

    h('div', { class: 'streak-aura', 'aria-hidden': 'true' }, h('i'), h('i'), h('i')),
    h('div', { class: 'streak-body' },
      profile ? h('div', { class: 'streak-hello' }, `${greeting()}, ${firstName()}!`) : null,
      h('div', { class: 'flame-wrap' }, h('div', { class: 'flame-halo' }), svg),
      num,
      h('div', { class: 'streak-unit', style: '--i:2' }, 'päivän streak'),
      h('p', { class: 'streak-msg', style: '--i:3' }, msg),
      h('p', { class: 'streak-text', style: '--i:4' }, 'Joka päivä, kun merkitset tehtäviä päiväkirjaan, streakisi kasvaa yhdellä. Jos päivä jää väliin, streak alkaa alusta.'),
      h('div', { class: 'week', style: '--i:5', 'aria-label': 'Tämä viikko' }, days.map((d, i) => {
        const k = dayKey(d), on = activeDays.has(k), today = k === todayKey, future = k > todayKey;
        return h('div', { class: today ? 'is-today' : null },
          h('i', { class: (on ? 'on' : '') + (today ? ' today' : '') + (future ? ' future' : ''), style: `--d:${i}`, title: today ? 'Tänään' : future ? 'Tulossa' : on ? 'Merkintöjä' : 'Ei merkintöjä' }),
          WD[d.getDay()]);
      })),
      s.best > 1 ? h('div', { class: 'best', style: '--i:6' }, `Paras streak: ${s.best} päivää`) : null),
    h('div', { class: 'dlg-foot' },
      h('button', { class: 'flame-btn', onclick: closeStreak }, s.todayDone ? 'Jatketaan' : 'Mennään merkkaamaan')));
  dlg.classList.add('streak');

let scoreDetailsOpen = false;

function compactList(items) {
  // 3, 4, 5, 6, 9 → 3–6, 9
  const out = [];
  for (let i = 0; i < items.length; i++) {
    let j = i;
    while (j + 1 < items.length && /^\d+$/.test(items[j]) && +items[j + 1] === +items[j] + 1) j++;
    out.push(j - i >= 2 ? `${items[i]}–${items[j]}` : items.slice(i, j + 1).join(', '));
    i = j;
  }
  return out.join(', ');

function refreshStats(c) {

  if (old) {
    const oldVals = [...old.querySelectorAll('.fig i.v')].map(e => e.textContent);

    const fresh = scoreEl(c);
    fresh.querySelectorAll('.fig i.v').forEach((e, i) => { if (oldVals[i] != null && oldVals[i] !== e.textContent) e.classList.add('changed'); });
    old.replaceWith(fresh);
    growFill(fresh, oldFill);
  }
  const sh = c.sheets[c.lastSheet];
  if (!sh) return;
  const labels = document.querySelectorAll('.l-sec [data-sec]');
  sh.sections.forEach((sec, i) => { if (labels[i]) labels[i].textContent = secText(c, sec); });
  const btn = document.querySelector('button.tab.on');
  if (btn) { btn.querySelector('small')?.remove(); const n = sheetCount(c, sh); if (n) btn.append(h('small', {}, n)); }
}

// Vain "Tehty" lasketaan pisteisiin ja viedään Exceliin, muut ovat opiskelijan omia muistilappuja
const STATUSES = [
  { k: 'done', label: 'Tehty', ic: '✓', desc: 'lasketaan pisteisiin' },

const BRUSH_KEY = 'mathsmart.brush';
let brush = 'done';
try { if (statusDef(localStorage.getItem(BRUSH_KEY))) brush = localStorage.getItem(BRUSH_KEY); } catch (e) {}
function setBrush(k) {

  try { localStorage.setItem(BRUSH_KEY, k); } catch (e) {}
  document.querySelectorAll('.brush button').forEach(b => { const on = b.dataset.st === k; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function cellStatus(c, chId, key) {
  if (c.state.marks[chId]?.[key]) return 'done';
  return c.state.flags[chId]?.[key]?.s || null;
}
const cellNote = (c, chId, key) => c.state.tnotes[chId]?.[key] || '';
function brushEl() {

    }, h('span', { class: 'st-ic' }, st.ic), st.label, h('kbd', {}, i + 1))),
    h('span', { class: 'hint' }, '– oikea klikkaus avaa kaikki vaihtoehdot ja muistiinpanon'));
}

function chapterRow(c, ch) {
  const target = c.state.target[ch.id] || '';
  const count = chapterCount(c, ch);
  const [no, title] = splitChapter(ch.name);
  const rerender = (focusKey, prevCount) => {
    const old = document.querySelector(`[data-ch="${ch.id}"]`);
    const fresh = chapterRow(c, ch);
    if (old) { fresh.style.cssText = old.style.cssText; old.replaceWith(fresh); }
    const cell = focusKey && fresh.querySelector(`[data-k="${CSS.escape(focusKey)}"]`);
    if (cell) {
      cell.focus({ preventScroll: true });
      cell.classList.add(cell.classList.contains('on') || cell.classList.contains('st') ? 'pop' : 'unpop');
    }
    if (prevCount != null && prevCount !== chapterCount(c, ch)) fresh.querySelector('.ch-count')?.classList.add('bump');
    refreshStats(c);
    refreshFlags(c);
  };
  // Asettaa tehtävälle yhden tilan (tai tyhjentää sen); tehty ja omat merkinnät ovat toisensa poissulkevia
  const setStatus = (lvl, n, st) => {
    const key = markKey(lvl, n);
    if (cellStatus(c, ch.id, key) === st) return;
    const before = chapterCount(c, ch);
    snapshot(c, `merkintä ${n}`);
    const m = c.state.marks[ch.id] ||= {};
    const f = c.state.flags[ch.id] ||= {};
    delete m[key]; delete f[key];
    if (st === 'done') m[key] = { t: Date.now() };
    else if (st) f[key] = { s: st, t: Date.now() };
    if (!Object.keys(m).length) delete c.state.marks[ch.id];
    if (!Object.keys(f).length) delete c.state.flags[ch.id];
    touch(c);
    rerender(key, before);
    if (st === 'done') logActivity();
  };
  let tpBefore = null;
  return h('div', { class: 'l-row ch' + (count ? '' : ' empty'), 'data-ch': ch.id },
    h('div', { class: 'ch-name' },
      h('span', { class: 'ch-no' }, no || '·'),
      h('span', { class: 'ch-title' }, title),
      h('span', { class: 'ch-count' + (count ? '' : ' zero'), title: count ? `${count} tehtävää tehty` : 'Ei vielä merkintöjä' }, count || '–'),
      ch.tpRef ? h('div', { class: 'ch-sub' },
        h('label', {}, 'Taitopuntari',
          h('input', { inputmode: 'decimal', value: c.state.tp[ch.id] || '', placeholder: '–', 'aria-label': 'Taitopuntarin pisteet',
            onfocus: () => { tpBefore = JSON.stringify(c.state); },
            onchange: () => { if (tpBefore) pushUndo(c, tpBefore, 'taitopuntari'); tpBefore = JSON.stringify(c.state); },
            oninput: e => { c.state.tp[ch.id] = e.target.value; touch(c); refreshStats(c); } }))) : null),
    LEVELS.map(L => h('div', { class: 'lv ' + L.k + (target && target !== L.k ? ' dim' : ''), 'data-label': L.label },
      h('div', { class: 'cells' }, ch.levels[L.k].map(t => {
        const key = markKey(L.k, t.n);
        const st = cellStatus(c, ch.id, key);

async function restoreBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('Tiedosto ei ole kelvollinen varmuuskopio.'); return; }
  if (data.app !== 'opiskelupoytakirjat' || !Array.isArray(data.courses)) { toast('Tiedosto ei ole tämän sovelluksen varmuuskopio.'); return; }
  const n = data.courses.length;
  if (!await confirmDialog('Palautetaanko varmuuskopio?', `Varmuuskopiossa on ${n} kurssia. Samannimiset (saman tunnisteen) kurssit korvataan, muut säilyvät.`, 'Palauta')) return;
  try {
    for (const c of data.courses) {
      if (data.files?.[c.id]) localStorage.setItem(FILEKEY + c.id, data.files[c.id]);
      migrateMarks(c);
      courses = courses.filter(x => x.id !== c.id).concat(c);
    }
    if (Array.isArray(data.days)) { data.days.forEach(d => activeDays.add(d)); saveDays(); }
    if ((data.profile?.name || data.profile?.first) && !profile) { profile = normalizeProfile(data.profile); saveProfile(); }
    if (Array.isArray(data.teachers)) {
      for (const t of data.teachers) if (t?.id && !teachers.some(x => x.id === t.id || (x.email && x.email === t.email))) teachers.push(t);
      saveTeachers();
    }
    saveNow(); loadDays(); drawStreakBtn(); go('#/'); toast(`Palautettu ${n} kurssia.`);
  } catch (e) { toast('Palautus epäonnistui: ' + e.message); }
}

/* ---------- Tiedostojen tuonti ---------- */
async function handleFiles(list) {
  let last = null;
  for (const file of list) {
    if (/\.json$/i.test(file.name)) { await restoreBackup(file); continue; }
    if (!/\.xlsx$/i.test(file.name)) { toast(file.name + ': vain .xlsx-tiedostot käyvät.'); continue; }
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const parsed = await parseXlsx(bytes.slice().buffer, file.name);
      delete parsed.entries;
      const c = await importDialog(parsed, bytes);
      if (c) last = c;
    } catch (e) { toast(file.name + ': ' + e.message); }
  }
  if (last) go('#/k/' + last.id);
}

// Luonnos .eml-tiedostona: X-Unsent-otsake saa Outlookin avaamaan sen lähettämättömänä viestinä liitteineen
const b64Lines = b64 => b64.replace(/.{1,76}/g, '$&\r\n');
const mimeWord = t => /^[\x20-\x7e]*$/.test(t) ? t : '=?UTF-8?B?' + bytesToB64(new TextEncoder().encode(t)) + '?=';
async function buildEml(to, toName, subject, body, file) {
  const boundary = 'ms_' + uid() + uid();
  const fileB64 = bytesToB64(new Uint8Array(await file.blob.arrayBuffer()));
  const name = mimeWord(file.name);
  const lines = [
    `To: ${mimeWord(toName.replace(/["<>]/g, ''))} <${to}>`,
    `Subject: ${mimeWord(subject)}`,
    'X-Unsent: 1',
    'MIME-Version: 1.0',
    `Content-Type: multipart/mixed; boundary="${boundary}"`,
    '',
    `--${boundary}`,
    'Content-Type: text/plain; charset=UTF-8',
    'Content-Transfer-Encoding: base64',
    '',
    b64Lines(bytesToB64(new TextEncoder().encode(body.replace(/\n/g, '\r\n')))),
    `--${boundary}`,
    `Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet; name="${name}"`,
    `Content-Disposition: attachment; filename="${name}"`,
    'Content-Transfer-Encoding: base64',
    '',
    b64Lines(fileB64),
    `--${boundary}--`,
    '',
  ];
  return new Blob([lines.join('\r\n')], { type: 'message/rfc822' });
}
