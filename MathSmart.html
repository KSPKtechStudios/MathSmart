  dlg.addEventListener('close', () => setTimeout(() => URL.revokeObjectURL(href), 60000), { once: true });
}

/* ---------- Laskin ---------- */
// Oma jäsennin: ei eval-kutsua, tukee pilkkua desimaalina ja implisiittistä kertolaskua (2π, 3(4+1))
const CALC_FNS = {
  sin: (x, d) => Math.sin(d ? x * Math.PI / 180 : x), cos: (x, d) => Math.cos(d ? x * Math.PI / 180 : x), tan: (x, d) => {
    if (d && Math.abs(((x % 180) + 180) % 180 - 90) < 1e-12) throw new Error('tan ei ole määritelty');
    return Math.tan(d ? x * Math.PI / 180 : x);
  },
  asin: (x, d) => Math.asin(x) * (d ? 180 / Math.PI : 1), acos: (x, d) => Math.acos(x) * (d ? 180 / Math.PI : 1), atan: (x, d) => Math.atan(x) * (d ? 180 / Math.PI : 1),
  sqrt: x => Math.sqrt(x), ln: x => Math.log(x), log: x => Math.log10(x), abs: x => Math.abs(x),
};
function calcEval(src, deg, ans) {
  const toks = [];
  const re = /\s*(?:(\d+(?:[.,]\d*)?|[.,]\d+)|([a-zA-ZäöπÅÄÖ]+)|(\*\*|[-+*/×÷−^()!%²√·]))/y;
  let i = 0;
  src = src.trim();
  while (i < src.length) {
    re.lastIndex = i;
    const m = re.exec(src);
    if (!m) throw new Error('Tuntematon merkki ”' + src[i].trim() + '”');
    i = re.lastIndex;
    if (m[1]) toks.push({ t: 'n', v: parseFloat(m[1].replace(',', '.')) });
    else if (m[2]) {
      // Kirjainjono voi olla useampi nimi peräkkäin, esim. "pisin" → pi sin
      let w = m[2].toLowerCase();
      while (w) {
        const name = ['asin', 'acos', 'atan', 'sqrt', 'sin', 'cos', 'tan', 'abs', 'ans', 'log', 'ln', 'pi', 'π', 'e'].find(x => w.startsWith(x));
        if (!name) throw new Error('Tuntematon nimi ”' + w + '”');
        toks.push(CALC_FNS[name] ? { t: 'f', v: name } : { t: 'c', v: name === 'ans' ? ans : name === 'e' ? Math.E : Math.PI });
        w = w.slice(name.length);
      }
    } else toks.push({ t: 'o', v: ({ '×': '*', '·': '*', '÷': '/', '−': '-', '**': '^' })[m[3]] || m[3] });
  }
  let p = 0;
  const peek = () => toks[p], isOp = v => peek()?.t === 'o' && peek().v === v;
  const startsOperand = () => { const t = peek(); return t && (t.t !== 'o' || t.v === '(' || t.v === '√'); };
  function expr() {
    let v = term();
    while (isOp('+') || isOp('-')) v = toks[p++].v === '+' ? v + term() : v - term();
    return v;
  }
  function term() {
    let v = unary();
    for (;;) {
      if (isOp('*')) { p++; v *= unary(); }
      else if (isOp('/')) { p++; const d = unary(); if (d === 0) throw new Error('Nollalla ei voi jakaa'); v /= d; }
      else if (startsOperand()) v *= power();
      else return v;
    }
  }
  function unary() {
    if (isOp('-')) { p++; return -unary(); }
    if (isOp('+')) { p++; return unary(); }
    return power();
  }
  function power() {
    const b = postfix();
    if (isOp('^')) { p++; return Math.pow(b, unary()); }
    return b;
  }
  function postfix() {
    let v = primary();
    for (;;) {
      if (isOp('²')) { p++; v = v * v; }
      else if (isOp('%')) { p++; v = v / 100; }
      else if (isOp('!')) {
        p++;
        if (v < 0 || !Number.isInteger(v) || v > 170) throw new Error('Kertoma vain kokonaisluvuille 0–170');
        let f = 1; for (let k = 2; k <= v; k++) f *= k; v = f;
      } else return v;
    }
  }
  function primary() {
    const t = toks[p++];
    if (!t) throw new Error('Lasku jäi kesken');
    if (t.t === 'n' || t.t === 'c') return t.v;
    if (t.t === 'f') {
      const x = isOp('(') ? primary() : power();
      return CALC_FNS[t.v](x, deg);
    }
    if (t.v === '√') return Math.sqrt(isOp('(') ? primary() : power());
    if (t.v === '(') {
      const v = expr();
      if (isOp(')')) p++; // puuttuva loppusulku sallitaan
      return v;
    }
    throw new Error('Odottamaton ”' + t.v + '”');
  }
  if (!toks.length) throw new Error('');
  const v = expr();
  if (p < toks.length) throw new Error('Odottamaton ”' + toks[p].v + '”');
  if (!Number.isFinite(v)) throw new Error(Number.isNaN(v) ? 'Ei määritelty' : 'Liian suuri luku');
  return v;
}
// Pyöristys piilottaa liukulukuvirheet (0,1 + 0,2 = 0,3)
const calcRound = v => { const r = parseFloat(v.toPrecision(12)); return Object.is(r, -0) ? 0 : r; };
const calcFmt = v => {
  const r = calcRound(v);
  return Math.abs(r) >= 1e15 || (r !== 0 && Math.abs(r) < 1e-9) ? r.toExponential(8).replace(/\.?0+e/, 'e').replace('.', ',') : String(r).replace('.', ',');
};

const calcEl = $('#calc'), calcBtn = $('#calcBtn');
const CALC_KEY = 'mathsmart.calc';
let calcState = { deg: true, ans: 0, hist: [], pos: null };
try { calcState = { ...calcState, ...JSON.parse(localStorage.getItem(CALC_KEY) || '{}') }; } catch (e) {}
const saveCalc = () => { try { localStorage.setItem(CALC_KEY, JSON.stringify(calcState)); } catch (e) {} };
let calcInput = null;
function buildCalc() {
  const input = h('input', { 'aria-label': 'Lasku', autocomplete: 'off', spellcheck: 'false', inputmode: 'decimal', placeholder: '0' });
  const prev = h('div', { class: 'calc-prev', 'aria-live': 'polite' });
  const hist = h('div', { class: 'calc-hist' });
  const modeBtn = h('button', { type: 'button', title: 'Kulmayksikkö trigonometrisille funktioille' });
  calcInput = input;
  const drawMode = () => { modeBtn.textContent = calcState.deg ? 'DEG' : 'RAD'; };
  const drawHist = () => {
    hist.replaceChildren(...calcState.hist.map(x => h('button', { type: 'button', title: 'Käytä tulosta', onclick: () => insert(x.r) }, `${x.e} = ${x.r}`)));
    hist.scrollTop = hist.scrollHeight;
  };
  const preview = () => {
    const v = input.value;
    prev.classList.remove('err');
    if (!v.trim()) { prev.textContent = ''; return; }
    try {
      const r = calcFmt(calcEval(v, calcState.deg, calcState.ans));
      prev.textContent = r === v.trim() ? '' : '= ' + r;
    } catch (e) { prev.textContent = ''; }
  };
  const insert = text => {
    const a = input.selectionStart ?? input.value.length, b = input.selectionEnd ?? a;
    input.value = input.value.slice(0, a) + text + input.value.slice(b);
    const at = a + text.length - (text.endsWith('()') ? 1 : 0);
    input.setSelectionRange(at, at);
    input.focus();
    preview();
  };
  const equals = () => {
    const e = input.value.trim();
    if (!e) return;
    try {
      const v = calcEval(e, calcState.deg, calcState.ans);
      const r = calcFmt(v);
      calcState.ans = calcRound(v);
      calcState.hist = [...calcState.hist, { e, r }].slice(-30);
      saveCalc(); drawHist();
      input.value = r; prev.textContent = '';
      input.setSelectionRange(r.length, r.length);
    } catch (err) {
      prev.classList.add('err');
      prev.textContent = err.message || 'Tarkista lasku';
      input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
    }
  };
  const back = () => {
    const a = input.selectionStart, b = input.selectionEnd;
    if (a !== b) input.value = input.value.slice(0, a) + input.value.slice(b);
    else if (a > 0) { input.value = input.value.slice(0, a - 1) + input.value.slice(a); input.setSelectionRange(a - 1, a - 1); }
    input.focus(); preview();
  };
  const clear = () => { input.value = ''; prev.textContent = ''; input.focus(); };
  input.addEventListener('input', preview);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); toggleCalc(false); }
    else if (e.key === 'Delete' && e.ctrlKey) { e.preventDefault(); clear(); }
  });
  modeBtn.onclick = () => { calcState.deg = !calcState.deg; saveCalc(); drawMode(); preview(); input.focus(); };
  const K = (label, act, cls, title) => h('button', { type: 'button', class: cls || null, title: title || null, onclick: act }, label);
  const ins = t => () => insert(t);
  const keys = h('div', { class: 'calc-keys' },
    K('sin', ins('sin('), 'fn'), K('cos', ins('cos('), 'fn'), K('tan', ins('tan('), 'fn'), K('ln', ins('ln('), 'fn', 'Luonnollinen logaritmi'), K('log', ins('log('), 'fn', '10-kantainen logaritmi'),
    K('√', ins('√('), 'fn', 'Neliöjuuri'), K('x²', ins('²'), 'fn', 'Toiseen potenssiin'), K('xʸ', ins('^'), 'fn', 'Potenssi'), K('(', ins('('), 'fn'), K(')', ins(')'), 'fn'),
    K('7', ins('7')), K('8', ins('8')), K('9', ins('9')), K('÷', ins('÷'), 'op'), K('C', clear, 'fn', 'Tyhjennä'),
    K('4', ins('4')), K('5', ins('5')), K('6', ins('6')), K('×', ins('×'), 'op'), K('⌫', back, 'fn', 'Poista merkki'),
    K('1', ins('1')), K('2', ins('2')), K('3', ins('3')), K('−', ins('−'), 'op'), K('π', ins('π'), 'fn'),
    K('0', ins('0')), K(',', ins(',')), K('Ans', ins('Ans'), 'fn', 'Edellinen tulos'), K('+', ins('+'), 'op'), K('=', equals, 'eq'));
  const head = h('div', { class: 'calc-head' }, h('b', {}, 'Laskin'), modeBtn,
    h('button', { type: 'button', title: 'Tyhjennä historia', onclick: () => { calcState.hist = []; saveCalc(); drawHist(); input.focus(); } }, 'Historia ×'),
    h('button', { type: 'button', class: 'x', title: 'Sulje (Esc)', 'aria-label': 'Sulje laskin', onclick: () => toggleCalc(false) }, '×'));
  // Laskinta voi siirtää otsikosta raahaamalla
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    const r = calcEl.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    head.setPointerCapture(e.pointerId);
    const move = ev => {
      const x = Math.max(8, Math.min(ev.clientX - dx, innerWidth - r.width - 8)), y = Math.max(8, Math.min(ev.clientY - dy, innerHeight - r.height - 8));
      Object.assign(calcEl.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto' });
      calcState.pos = { x, y };
    };
    const up = () => { head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); saveCalc(); };
    head.addEventListener('pointermove', move);
    head.addEventListener('pointerup', up);
  });
  head.addEventListener('dblclick', () => { calcState.pos = null; saveCalc(); calcEl.removeAttribute('style'); });
  calcEl.replaceChildren(head, hist, h('div', { class: 'calc-screen' }, input, prev), keys);
  drawMode(); drawHist();
}
function placeCalc() {
  const p = calcState.pos;
  if (!p) { calcEl.removeAttribute('style'); return; }
  const r = calcEl.getBoundingClientRect();
  Object.assign(calcEl.style, { left: Math.max(8, Math.min(p.x, innerWidth - r.width - 8)) + 'px', top: Math.max(8, Math.min(p.y, innerHeight - r.height - 8)) + 'px', right: 'auto', bottom: 'auto' });
}
function toggleCalc(show = calcEl.hidden) {
  if (!calcInput) buildCalc();
  calcEl.hidden = !show;
  calcBtn.classList.toggle('on', show);
  calcBtn.setAttribute('aria-expanded', String(show));
  calcBtn.setAttribute('aria-label', show ? 'Sulje laskin' : 'Avaa laskin');
  if (show) { placeCalc(); calcInput.focus(); calcInput.select(); }
  else if (calcEl.contains(document.activeElement)) calcBtn.focus();
}
calcBtn.onclick = () => toggleCalc();
window.addEventListener('resize', () => { if (!calcEl.hidden) placeCalc(); });

/* ---------- Teema ---------- */
const SUN = '<svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const currentTheme = () => document.documentElement.dataset.theme || (darkQuery.matches ? 'dark' : 'light');
function drawThemeBtn(animate) {
  const dark = currentTheme() === 'dark';
  const b = $('#themeBtn');
  b.innerHTML = dark ? SUN : MOON;
  b.title = dark ? 'Vaihda vaaleaan tilaan' : 'Vaihda tummaan tilaan';
  if (animate) b.firstChild.classList.add('spin-in');
}
function toggleTheme(fromEl) {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  const apply = () => {
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('mathsmart.theme', next); } catch (e) {}
    drawThemeBtn(true);
  };
  if (!document.startViewTransition || reduceMotion()) { apply(); return; }
  // Uusi teema leviää ympyränä napista koko ikkunaan
  const r = (fromEl || $('#themeBtn')).getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(apply);
  vt.ready.then(() => document.documentElement.animate(
    { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
    { duration: 800, easing: 'cubic-bezier(.16, 1, .3, 1)', pseudoElement: '::view-transition-new(root)' })).catch(() => {});
}
$('#themeBtn').onclick = e => toggleTheme(e.currentTarget);
darkQuery.addEventListener('change', () => drawThemeBtn());
drawThemeBtn();

$('#fileInput').onchange = e => { handleFiles([...e.target.files]); e.target.value = ''; };
$('#backupInput').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) { if (dlg.open) dlg.close(); restoreBackup(f); } };
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (e.dataTransfer?.types.includes('Files')) { dragDepth++; $('#drop').classList.add('on'); } });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('on');
  if (e.dataTransfer.files.length) handleFiles([...e.dataTransfer.files]);
});

if (!('DecompressionStream' in window)) {
  document.body.prepend(h('div', { style: 'padding:12px 24px;background:var(--warn-soft);color:var(--warn)' }, 'Selaimesi on liian vanha. Avaa sovellus Microsoft Edgellä tai Chromella.'));
}
loadAll();
loadProfile();
loadDays();
renderMenubar();
drawStreakBtn();
route();
if (profile) showStreak();
else showOnboarding(() => { route(); showStreak(); });
</script>
